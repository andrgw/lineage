<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lambda Lineage — Local Viewer</title>
  <style>
    :root { color-scheme: dark; --ink:#eaf0fa; --muted:#9aa8bd; --surface:#101827; --line:#25334b; --blue:#477fe5; --red:#df5a64; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; color:var(--ink); background:#09111d; }
    header { display:flex; gap:16px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:2; }
    h1 { font-size:17px; margin:0; white-space:nowrap; } input { width:min(370px, 45vw); background:#0a1220; color:var(--ink); border:1px solid #33445f; border-radius:6px; padding:8px 10px; }
    .hint { color:var(--muted); margin-left:auto; } #layout { display:grid; grid-template-columns:1fr 300px; min-height:calc(100vh - 52px); }
    #viewport { overflow:auto; background:#0b1421; } svg { display:block; min-width:1650px; min-height:1100px; } .class-label { fill:#9eafc8; font-size:12px; font-weight:700; text-anchor:end; }
    .edge { stroke:#4c5d77; stroke-width:1.15; opacity:.58; } .node circle { fill:#1e2b40; stroke:#7183a0; stroke-width:1; } .node text { fill:#eaf0fa; font-size:10px; pointer-events:none; }
    .node.president circle { fill:var(--blue); stroke:#9ebdff; } .node.sensei circle { fill:var(--red); stroke:#ffadb4; } .node.both circle { fill:#8e5aad; stroke:#e1b8ff; }
    .node.dim, .edge.dim { opacity:.09; } .node.match circle { stroke:#f8d668; stroke-width:3; } .node.related circle { stroke:#74e0c3; stroke-width:2.5; }
    aside { border-left:1px solid var(--line); background:var(--surface); padding:18px; } aside h2 { font-size:16px; margin:0 0 10px; } aside p, aside li { color:var(--muted); } .badge { display:inline-block; padding:2px 6px; border:1px solid #405371; border-radius:999px; margin:2px 3px 2px 0; font-size:11px; } .error { color:#ff9a9f; padding:24px; }
    @media (max-width: 800px) { #layout { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } .hint { display:none; } }
  </style>
</head>
<body>
  <header><h1>Lambda Lineage <small>local</small></h1><input id="search" placeholder="Search name, roster #, or pledge class" autocomplete="off"><span class="hint">Click a member to trace their family</span></header>
  <main id="layout"><section id="viewport"><svg id="graph" aria-label="Lambda lineage graph"></svg></section><aside id="details"><h2>Lineage viewer</h2><p>Build the local data first, then select a member to see their recorded Big Bros and Littles.</p><p>Blue = President · Red = Sensei · Purple = both.</p></aside></main>
  <script>
    const svg = document.querySelector('#graph'), details = document.querySelector('#details'), search = document.querySelector('#search');
    const ns = 'http://www.w3.org/2000/svg'; const make = (tag, attrs={}) => { const el=document.createElementNS(ns,tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); return el; };
    Promise.all(['data/members.json','data/lineage_edges.json'].map(url => fetch(url).then(r => { if (!r.ok) throw Error(url); return r.json(); })))
      .then(([members, edges]) => setup(members, edges)).catch(() => { details.innerHTML='<h2>Local data not built</h2><p class="error">Run <code>.venv/bin/python scripts/build_lineage.py</code>, then serve the <code>public</code> directory.</p>'; });
    function setup(members, edges) {
      const classes=[...new Map(members.sort((a,b)=>a.class_rank-b.class_rank).map(m=>[m.class_rank,m.pledge_class])).entries()];
      const byId=new Map(members.map(m=>[m.id,m])), parents=new Map(), children=new Map();
      for (const e of edges) { (parents.get(e.little_bro_id)||parents.set(e.little_bro_id,[]).get(e.little_bro_id)).push(e.big_bro_id); (children.get(e.big_bro_id)||children.set(e.big_bro_id,[]).get(e.big_bro_id)).push(e.little_bro_id); }
      const width=1800, rowHeight=34, left=150, top=42; svg.setAttribute('viewBox',`0 0 ${width} ${top+classes.length*rowHeight+35}`);
      const positions=new Map();
      classes.forEach(([rank,label]) => { const group=members.filter(m=>m.class_rank===rank); group.forEach((m,i)=>positions.set(m.id,{x:left+(i+0.5)*(Math.max(1,(width-left-35)/group.length)), y:top+rank*rowHeight})); const text=make('text',{x:left-12,y:top+rank*rowHeight+4,class:'class-label'}); text.textContent=label.toUpperCase(); svg.append(text); });
      const edgeLayer=make('g'), nodeLayer=make('g'); svg.append(edgeLayer,nodeLayer);
      edges.forEach(e=>{ const a=positions.get(e.big_bro_id), b=positions.get(e.little_bro_id); if(!a||!b)return; const line=make('line',{x1:a.x,y1:a.y+7,x2:b.x,y2:b.y-7,class:'edge','data-edge':`${e.big_bro_id}|${e.little_bro_id}`}); edgeLayer.append(line); });
      members.forEach(m=>{ const p=positions.get(m.id), roles=m.roles||[], cls=roles.includes('president')&&roles.includes('sensei')?'both':roles.includes('president')?'president':roles.includes('sensei')?'sensei':''; const g=make('g',{class:`node ${cls}`,'data-id':m.id,tabindex:'0',role:'button'}); g.append(make('circle',{cx:p.x,cy:p.y,r:6})); const t=make('text',{x:p.x+8,y:p.y+3}); t.textContent=`#${m.roster_number} ${m.name}`; g.append(t); g.addEventListener('click',()=>select(m.id)); g.addEventListener('keydown',e=>{if(e.key==='Enter')select(m.id)}); nodeLayer.append(g); });
      function related(id) { const found=new Set([id]), queue=[id]; while(queue.length){ const cur=queue.shift(); [...(parents.get(cur)||[]),...(children.get(cur)||[])].forEach(next=>{if(!found.has(next)){found.add(next);queue.push(next)}}); } return found; }
      function select(id) { const m=byId.get(id), family=related(id); document.querySelectorAll('.node').forEach(el=>el.classList.toggle('related',family.has(el.dataset.id))); document.querySelectorAll('.edge').forEach(el=>{const [a,b]=el.dataset.edge.split('|');el.classList.toggle('dim',!family.has(a)||!family.has(b));}); details.innerHTML=`<h2>#${m.roster_number} ${m.name}</h2><p>${m.pledge_class}</p>${(m.roles||[]).map(r=>`<span class="badge">${r}</span>`).join('')}<h3>Big Bros</h3><p>${(parents.get(id)||[]).map(x=>byId.get(x).name).join('<br>')||'No recorded link'}</p><h3>Littles</h3><p>${(children.get(id)||[]).map(x=>byId.get(x).name).join('<br>')||'No recorded link'}</p>`; }
      search.addEventListener('input',()=>{ const q=search.value.trim().toLowerCase(); document.querySelectorAll('.node').forEach(el=>{const m=byId.get(el.dataset.id), matched=!q||`${m.name} ${m.roster_number} ${m.pledge_class}`.toLowerCase().includes(q);el.classList.toggle('dim',!matched);el.classList.toggle('match',!!q&&matched);}); });
    }
  </script>
</body>
</html>
