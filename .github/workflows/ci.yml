name: Lineage CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Python environment
        run: make setup
      - name: Validate source and prepare viewer graph
        run: make prepare
      - name: Run tests
        run: make test
      - name: Lint
        run: make lint
      - name: Build Cloudflare Worker package
        run: make build
