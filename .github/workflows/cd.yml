name: Deploy lineage to Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Python environment
        run: make setup
      - name: Validate source and prepare viewer graph
        run: make prepare
      - name: Run tests
        run: make test
      - name: Lint
        run: make lint
      - name: Build Worker
        run: make build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd dist/deploy/stanford-lambdas-lineage && npm run deploy
